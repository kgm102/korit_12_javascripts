<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body bgcolor="5f5f5f">
  <h1>01_fetchapi.html</h1>
  <script>
    // 형식에 주목해두겠습니다.
    // Get / Read : 읽어오기  / id가 1인 데이터 조회
    fetch("https://jsonplaceholder.typicode.com/posts/1")
    .then(response => response.json())
    .then((json) => console.log(json.body));

    // Post / Create : 데이터 생성
    fetch("https://jsonplaceholder.typicode.com/posts",{
      method: "POST", // http request 요쳥 방문
      body: JSON.stringify({
        title: 'foo',
        body: 'bar',
        userId: 1,
      }),
      headers: {
        "content-type": "application/json; charset = UTF-8",
      },
    })
    .then(response => response.json())
    .then(json => console.log(json));

    // Put / Update : 데이터 수정
    fetch("https://jsonplaceholder.typicode.com/posts/1", {
      method: 'PUT',
      body: JSON.stringify({
        id: 1,
        title: 'Promise',
        body: 'Prometheus',
        userId: 1,
      }),
      headers: {
        'Content-type': 'application/json; charset=UTF-8',
      },
    })
    .then(response => response.json())
    .then(json => console.log(json));

    // Delete - 데이터 삭제
    fetch("https://jsonplaceholder.typicode.com/posts/1", {
      method: "DELETE",
    });
    // 근대 삭제 됐는지 확인할 수가 없기 때문에 Read를 새로 해야 합니다.
    fetch("https://jsonplaceholder.typicode.com/posts/1")
    .then(response => response.json())
    .then((json) => console.log(json.body));
    // 그러니까 삭제 후에는 todolist 기준으로 redndorTodo를 새로 해야겠네요.
    // C / U / D 뒤에는 -> 새로 R을 해야한다고 알고 있겠습니다.
  </script>
</body>
</html>
