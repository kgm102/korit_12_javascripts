<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML/CSS 미실습 연습</title>
  <link rel="stylesheet" href="./preview.css">
</head>
<body>

  <header>
    <h1>HTML/CSS 미실습 연습</h1>
  </header>

  <section>
    <h2>강조 텍스트</h2>
    <p>이 단어는 <strong>중요</strong>하고, 이 단어는 <mark>하이라이트</mark> 되었습니다.</p>
  </section>

  <section>
    <h2>인용문 & 정의 목록</h2>
    <blockquote>“연습은 완벽을 만든다.”</blockquote>
    <dl>
      <dt>HTML</dt>
      <dd>웹 페이지 구조를 담당하는 언어</dd>
      <dt>CSS</dt>
      <dd>웹 페이지 스타일을 담당하는 언어</dd>
    </dl>
  </section>

  <section>
    <h2>이미지 & 표</h2>
    <img src="https://via.placeholder.com/150" alt="샘플 이미지">
    <table>
      <tr><th>요일</th><th>할 일</th></tr>
      <tr><td>월</td><td>HTML 연습</td></tr>
      <tr><td>화</td><td>CSS 연습</td></tr>
    </table>
  </section>

  <section>
    <h2>폼 연습</h2>
    <form>
      <label for="name">이름:</label>
      <input type="text" id="name" name="name"><br><br>
      <label for="email">이메일:</label>
      <input type="email" id="email" name="email"><br><br>
      <button type="submit">전송</button>
    </form>
  </section>

  <section>
    <h2>외부 콘텐츠 & 미디어</h2>
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video"></iframe>
    <audio controls>
      <source src="sample.mp3" type="audio/mpeg">
      브라우저가 audio 태그를 지원하지 않습니다.
    </audio>
    <video controls>
      <source src="sample.mp4" type="video/mp4">
      브라우저가 video 태그를 지원하지 않습니다.
    </video>
  </section>

  <footer>
    © 2026 HTML/CSS 미실습
  </footer>

</body>
</html>
